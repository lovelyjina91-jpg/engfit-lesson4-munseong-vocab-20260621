<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EngFit 단어 테스트 · Lesson 4 (영영풀이)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3f5c8c;
    --blue-d:#324a73;
    --blue-l:#4a6aa0;
    --ink:#3f5c8c;
    --sub:#8a9ab5;
    --paperbg:#c2cfe4;
    --card:#fdfdfc;
    --cream:#f1f4f9;
    --green:#4f7d4e;
    --green-bg:#ecf4ea;
    --red:#c0564b;
    --red-bg:#faeceb;
    --line:#d8dfe9;
    --shadow:0 14px 36px rgba(63,92,140,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:16px;
    background:
      radial-gradient(circle at 80% 10%, rgba(255,255,255,.5) 0%, transparent 35%),
      linear-gradient(150deg, #cdd9ea 0%, #c2cfe4 50%, #b8c7de 100%);
    position:relative;overflow-x:hidden;
  }
  /* 모눈 두들 */
  body::before{
    content:'';position:fixed;top:4%;left:4%;width:48px;height:36px;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, #4a6aa0 0 1.5px, transparent 1.5px 8px),
      repeating-linear-gradient(90deg, #4a6aa0 0 1.5px, transparent 1.5px 8px);
    opacity:.6;
  }
  .deco{position:fixed;pointer-events:none;z-index:0;color:#4a6aa0;}
  .deco.sketch{font-size:40px;opacity:.85;}
  .deco.sm{font-size:22px;opacity:.7;}
  .eng{font-family:'Patrick Hand',cursive;}
  .app{
    width:100%;max-width:460px;
    /* 구겨진 종이 질감 */
    background:
      linear-gradient(115deg, rgba(0,0,0,.035) 0%, transparent 18%, rgba(0,0,0,.04) 33%, transparent 47%, rgba(0,0,0,.03) 62%, transparent 76%, rgba(0,0,0,.045) 90%),
      linear-gradient(28deg, transparent 12%, rgba(0,0,0,.03) 25%, transparent 38%, rgba(0,0,0,.04) 55%, transparent 70%, rgba(0,0,0,.03) 86%),
      linear-gradient(75deg, rgba(255,255,255,.8) 0%, #fdfdfc 40%, #f6f6f3 100%);
    border-radius:14px 22px 16px 20px;
    box-shadow:var(--shadow), inset 0 0 30px rgba(0,0,0,.04);
    overflow:hidden;position:relative;min-height:620px;
    display:flex;flex-direction:column;z-index:1;
    border:1px solid rgba(74,106,160,.30);
  }
  .logo{display:flex;align-items:center;}
  .logo svg{display:block;}
  .screen{flex:1;display:none;flex-direction:column;padding:26px 22px 24px;}
  .screen.on{display:flex;}

  /* START */
  #start{align-items:center;justify-content:center;text-align:center;gap:6px;}
  #start .badge{
    margin:6px 0 12px;width:190px;height:190px;border-radius:50%;
    background:#fff;border:2.5px solid var(--blue);
    box-shadow:0 0 0 7px rgba(241,244,249,.9), 0 0 0 9px rgba(74,106,160,.75), 0 14px 26px rgba(63,92,140,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    position:relative;
  }
  .badge .star{color:var(--blue-l);font-size:15px;letter-spacing:5px;}
  #start h1{margin:10px 0 2px;font-size:1.5em;font-weight:900;color:var(--blue);}
  #start .unit{font-family:'Patrick Hand',cursive;font-size:1.3em;color:var(--blue-l);}
  #start .meta{margin-top:5px;font-size:.92em;color:var(--sub);}
  .btn{
    border:none;border-radius:16px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;transition:transform .08s, box-shadow .2s, background .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--blue);color:#fff;font-size:1.08em;padding:16px 20px;width:100%;
    box-shadow:0 8px 18px rgba(63,92,140,.35);
  }
  .btn-primary:active{background:var(--blue-d);}
  #start .startwrap{width:100%;margin-top:20px;}
  .kbdhint{margin-top:10px;font-size:.8em;color:var(--sub);line-height:1.6;}
  .kbdhint b{color:var(--blue-l);}

  /* QUIZ */
  #quiz{padding-top:18px;}
  .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .count{font-size:.92em;color:var(--sub);font-weight:700;}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue-l),#7e9bc8);border-radius:99px;transition:width .3s;}
  .prompt{
    flex:0 0 auto;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:10px;margin-bottom:20px;
  }
  .qtag{font-size:.82em;font-weight:700;color:var(--blue-l);background:rgba(74,106,160,.12);padding:5px 12px;border-radius:99px;}
  /* 영영풀이 카드 */
  .qword-def{
    font-family:'Patrick Hand',cursive;font-size:1.32em;line-height:1.5;color:var(--blue);
    background:#fff;border:2px dashed rgba(74,106,160,.45);border-radius:16px;
    padding:16px 16px;width:100%;
    box-shadow:inset 0 0 18px rgba(74,106,160,.05);
  }
  .qword-def .lead{
    display:block;font-family:'Noto Sans KR',sans-serif;font-size:.62em;font-weight:700;
    color:var(--blue-l);letter-spacing:1px;margin-bottom:7px;opacity:.85;
  }
  .choices{display:none;}

  /* 주관식 */
  .typebox{display:flex;flex-direction:column;gap:11px;margin-top:auto;}
  .typebox input{
    width:100%;text-align:center;background:#fff;border:2px solid var(--line);
    border-radius:16px;padding:14px;color:var(--ink);outline:none;
    font-family:'Patrick Hand',cursive;font-size:1.44em;
    transition:border-color .15s, background .15s;
  }
  .typebox input:focus{border-color:var(--blue-l);}
  .typebox input.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:700;}
  .typebox input.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .typeanswer{
    text-align:center;font-size:1em;color:var(--green);font-weight:700;display:none;
  }
  .typeanswer .eng{font-size:1.35em;}
  .typeanswer .ko{font-size:.86em;color:var(--sub);font-weight:600;}
  .typerow{display:flex;gap:10px;}
  .typerow .btn-primary{flex:1;}
  .hintbtn{
    background:#eef2f8;color:var(--blue-l);font-size:.92em;padding:0 16px;
    border:1.5px solid rgba(74,106,160,.30);white-space:nowrap;
  }
  .hintbtn:active{background:#e1e8f3;}
  .typehint{text-align:center;font-size:.8em;color:var(--sub);min-height:1.1em;}
  .typehint b{color:var(--blue-l);font-family:'Patrick Hand',cursive;font-size:1.25em;letter-spacing:2px;}

  /* RESULT */
  #result{padding-top:20px;}
  #result .logo{justify-content:center;margin-bottom:8px;}
  .scorecard{text-align:center;margin:6px 0 18px;}
  .scorecard .emoji{font-size:46px;}
  .scorecard .score{font-size:2.4em;font-weight:900;margin-top:4px;color:var(--blue);}
  .scorecard .score small{font-size:.42em;color:var(--sub);font-weight:700;}
  .scorecard .pct{font-size:1em;color:var(--blue-l);font-weight:700;margin-top:2px;}
  .reviewhead{font-size:.95em;font-weight:700;margin:6px 2px 10px;display:flex;justify-content:space-between;align-items:center;color:var(--blue);}
  .reviewhead .ok{color:var(--green);font-size:.92em;}
  .review{display:flex;flex-direction:column;gap:9px;max-height:240px;overflow-y:auto;padding:2px;}
  .ritem{border:1.5px solid var(--red-bg);background:#fff;border-radius:14px;padding:11px 13px;border-left:5px solid var(--red);}
  .ritem .q{font-size:.82em;color:var(--sub);font-weight:500;margin-bottom:5px;line-height:1.4;}
  .ritem .ans{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.95em;}
  .ritem .yours{color:var(--red);} .ritem .yours s{opacity:.8;}
  .ritem .right{color:var(--green);font-weight:700;}
  .ritem .right .ko{color:var(--sub);font-weight:600;font-size:.9em;}
  .ritem b.eng{font-family:'Patrick Hand',cursive;font-size:1.2em;font-weight:400;color:var(--blue);}
  .allright{text-align:center;color:var(--green);font-weight:700;padding:18px;background:var(--green-bg);border-radius:14px;}
  .actions{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .btn-kakao{background:#FEE500;color:#3a1d1d;font-size:1.04em;padding:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-ghost{background:#e3e9f2;color:var(--blue);font-size:1em;padding:14px;width:100%;}
  .toast{
    position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--blue);color:#fff;padding:11px 18px;border-radius:99px;font-size:.9em;font-weight:600;
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<!-- 구겨진 종이 + 블루 보태니컬 배경 장식 -->
<span class="deco sketch" style="top:1%;left:13%;font-size:32px">❀</span>
<span class="deco sketch" style="top:12%;right:4%;transform:rotate(15deg)">✿</span>
<span class="deco sm" style="top:40%;left:3%">✾</span>
<span class="deco sketch" style="bottom:16%;right:3%;transform:rotate(-12deg)">✿</span>

<span class="deco sm" style="bottom:10%;left:6%">❀</span>

<div class="app">

  <!-- START -->
  <section id="start" class="screen on">
    <div class="badge">
      <span class="star">★ ★ ★</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="150" role="img" aria-label="영핏 EngFit 로고">
        <g>
          <polygon points="60,18 100,40 60,62 20,40" fill="#1f2a52"/>
          <polygon points="20,40 60,62 60,108 20,86" fill="#27336b"/>
          <polygon points="60,62 100,40 100,86 60,108" fill="#1f2a52"/>
          <polygon points="78,51 88,57 88,97 78,91" fill="#f0a830"/>
          <polygon points="74,29 84,35 78,38 68,32" fill="#f0a830"/>
        </g>
        <text x="120" y="78" font-family="'Noto Sans KR',sans-serif" font-size="58" font-weight="800" fill="#1f2a52" letter-spacing="2">영핏</text>
        <text x="122" y="104" font-family="'Noto Sans KR',sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#6b7280">영어를 <tspan fill="#1f2a52" font-weight="800">핏</tspan><tspan fill="#6b7280">하다</tspan></text>
      </svg>
      <span class="star">★ ★ ★</span>
    </div>
    <h1>단어 테스트</h1>
    <div class="unit eng">Lesson 4</div>
    <div class="meta">문성중 2학년 한승주 · 전체 24문항 랜덤</div>
    <div class="meta">📖 영영풀이를 읽고 → 영어 단어 쓰기</div>
    <div class="kbdhint">영영풀이(영어 뜻)를 읽고 <b>영어 단어</b>를 입력하세요<br>⏎ <b>Enter</b>로 제출 · 막히면 <b>💡힌트</b> · 대소문자 무시</div>
    <div class="startwrap">

    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen">
    <div class="qtop">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="92" role="img" aria-label="영핏 로고">
          <g>
            <polygon points="60,8 100,30 60,52 20,30" fill="#1f2a52"/>
            <polygon points="20,30 60,52 60,98 20,76" fill="#27336b"/>
            <polygon points="60,52 100,30 100,76 60,98" fill="#1f2a52"/>
            <polygon points="78,41 88,47 88,87 78,81" fill="#f0a830"/>
            <polygon points="74,19 84,25 78,28 68,22" fill="#f0a830"/>
          </g>
          <text x="118" y="74" font-family="'Noto Sans KR',sans-serif" font-size="56" font-weight="800" fill="#1f2a52" letter-spacing="2">영핏</text>
        </svg>
      </div>
      <div class="count"><span id="cur">1</span> / <span id="total">24</span></div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="prompt">
      <span class="qtag">영영풀이 → 영어로 쓰기 ⏎</span>
      <div class="qword-def" id="promptword"><span class="lead">DEFINITION</span><span id="defText"></span></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="typebox" id="typebox">
      <input type="text" id="typeinput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어 단어를 입력하세요">
      <div class="typeanswer" id="typeanswer"></div>
      <div class="typerow">
        <button class="btn btn-primary" id="typebtn" onclick="submitTyping()">제출 (Enter ⏎)</button>
        <button class="btn hintbtn" id="hintbtn" type="button" onclick="showHint()">💡 힌트</button>

      <div class="typehint" id="typehint">대소문자는 구분하지 않아요</div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="120" role="img" aria-label="영핏 EngFit 로고">
        <g>
          <polygon points="60,18 100,40 60,62 20,40" fill="#1f2a52"/>
          <polygon points="20,40 60,62 60,108 20,86" fill="#27336b"/>
          <polygon points="60,62 100,40 100,86 60,108" fill="#1f2a52"/>
          <polygon points="78,51 88,57 88,97 78,91" fill="#f0a830"/>
          <polygon points="74,29 84,35 78,38 68,32" fill="#f0a830"/>
        </g>
        <text x="120" y="78" font-family="'Noto Sans KR',sans-serif" font-size="58" font-weight="800" fill="#1f2a52" letter-spacing="2">영핏</text>
        <text x="122" y="104" font-family="'Noto Sans KR',sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#6b7280">영어를 <tspan fill="#1f2a52" font-weight="800">핏</tspan><tspan fill="#6b7280">하다</tspan></text>
      </svg>
    </div>
    <div class="scorecard">
      <div class="emoji" id="remoji">🎉</div>
      <div class="score"><span id="rscore">0</span><small> / <span id="rtotal">24</span></small></div>
      <div class="pct" id="rpct">0%</div>
    </div>
    <div class="reviewhead"><span id="rvtitle">오답 확인</span><span class="ok" id="rvok"></span></div>
    <div class="review" id="review"></div>
    <div class="actions">
      <button class="btn btn-kakao" onclick="copyResult()">📋 결과 복사하기 (카카오톡 전송용)</button>
      <button class="btn btn-ghost" onclick="restart()">다시 풀기 🔄</button>
    </div>
  </section>

  <div class="toast" id="toast">복사되었습니다!</div>

<script>
/* ===== 단어 데이터: Lesson 4 · 문성중 2학년 한승주 (24) · 영영풀이 포함 ===== */
const WORDS = [
  {en:"net", ko:"그물", def:"something used for catching fish, insects, or animals which is made of threads or wires"},
  {en:"expect", ko:"예상하다", def:"to think that something will probably or certainly happen"},
  {en:"magazine", ko:"잡지", def:"a type of thin book with a paper cover that contains stories, essays, pictures, etc., and that is usually published every week or month"},
  {en:"stripe", ko:"줄무늬", def:"a line of color, especially one of several lines of color all close together"},
  {en:"research", ko:"연구", def:"serious study of a subject, in order to discover new facts or test new ideas"},
  {en:"ocean", ko:"바다", def:"the salt water that covers much of the earth's surface"},
  {en:"leaf", ko:"잎", def:"a flat green part of a plant, growing from a stem or branch"},
  {en:"weigh", ko:"무게가 ~이다", def:"to have a particular weight"},
  {en:"drone", ko:"드론", def:"a type of small aircraft that flies without a pilot"},
  {en:"stomach", ko:"배, 위", def:"the organ in your body where food goes and begins to be digested after you swallow it"},
  {en:"fur", ko:"(동물의) 부드러운 털", def:"the thick soft hair that covers the bodies of some animals"},
  {en:"length", ko:"길이", def:"the measurement of how long something is from one end to the other"},
  {en:"complex", ko:"복잡한", def:"not easy to understand or explain, not simple"},
  {en:"tag", ko:"꼬리표; 꼬리표를 달다", def:"a piece of equipment that you attach to an animal or person so that you know where they are; to attach a tag to something"},
  {en:"give birth", ko:"낳다, 출산하다", def:"to produce a baby from the body"},
  {en:"splash", ko:"물보라", def:"the movement of liquid when something hits it"},
  {en:"underwater", ko:"물속에서", def:"beneath the surface of water"},
  {en:"giraffe", ko:"기린", def:"a very tall African animal that has an extremely long neck and legs"},
  {en:"tongue", ko:"혀", def:"the soft thing inside your mouth that you move and use for tasting and speaking"},
  {en:"whale", ko:"고래", def:"a very large animal that lives in the sea and looks like a fish, but is actually a mammal"},
  {en:"particularly", ko:"특히", def:"more than usual or more than others"},
  {en:"all of a sudden", ko:"갑자기", def:"quickly and unexpectedly"},
  {en:"pattern", ko:"무늬, 문양", def:"a repeated form or design especially that is used to decorate something"},
  {en:"record", ko:"기록하다, 녹음하다", def:"to write information down or store it in a computer so that it can be looked at in the future; to store music, sound, etc. on something so that you can listen to them again"}
];

let queue=[], idx=0, score=0, wrongs=[], locked=false, hinted=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}

function startQuiz(){
  // 전체 단어를 랜덤 순서로, 모두 영영풀이 → 영어 주관식
  queue = shuffle(WORDS).map(word=>({word, type:'def'}));
  idx=0; score=0; wrongs=[];
  document.getElementById('total').textContent=queue.length;
  show('quiz');
  render();
}

function render(){
  locked=false; hinted=false;
  const q=queue[idx];
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('prog').style.width=((idx)/queue.length*100)+'%';

  document.getElementById('defText').textContent=q.word.def;

  const inp=document.getElementById('typeinput');
  inp.value=''; inp.className=''; inp.disabled=false;
  document.getElementById('typeanswer').style.display='none';
  document.getElementById('typehint').innerHTML='대소문자는 구분하지 않아요';
  document.getElementById('hintbtn').disabled=false;
  inp.focus();
}

/* ===== 첫 글자 힌트 ===== */
function showHint(){
  const q=queue[idx];
  if(!q || locked) return;
  hinted=true;
  const en=q.word.en;
  const letters=en.replace(/[^A-Za-z]/g,'').length;
  const words=en.trim().split(/\s+/).length;
  const extra = words>1 ? (' · '+words+'단어') : '';
  document.getElementById('typehint').innerHTML='힌트: 첫 글자 <b>'+en[0].toUpperCase()+'</b> · 알파벳 '+letters+'글자'+extra;
  document.getElementById('hintbtn').disabled=true;
  document.getElementById('typeinput').focus();
}

/* ===== 주관식 채점 (대소문자 구분 없음) ===== */
function norm(s){
  return s.toLowerCase()
    .replace(/[’‘`]/g,"'")
    .replace(/\s+/g,' ')
    .trim();
}
function submitTyping(){
  if(locked) return;
  const q=queue[idx];
  if(!q) return;
  const inp=document.getElementById('typeinput');
  const val=inp.value;
  if(norm(val)==='') { inp.focus(); return; } // 빈 입력은 제출 안 됨
  locked=true;
  inp.disabled=true;
  document.getElementById('hintbtn').disabled=true;
  // 같은 영영풀이를 갖는 단어 모두 정답 인정(여기선 1:1)
  const accepted = WORDS.filter(w=>w.def===q.word.def).map(w=>norm(w.en));
  const correct = accepted.indexOf(norm(val))>=0;
  if(correct){
    inp.classList.add('correct');
    score++;
    setTimeout(next,250); // 정답 → 0.25초 후 넘어가기
  }else{
    inp.classList.add('wrong');
    const ans=document.getElementById('typeanswer');
    ans.innerHTML='정답: <b class="eng">'+q.word.en+'</b> <span class="ko">('+q.word.ko+')</span>';
    ans.style.display='block';
    wrongs.push({def:q.word.def, en:q.word.en, ko:q.word.ko, chosen:val.trim()});
    setTimeout(next,1700); // 오답 → 정답 보여주고 넘어가기
  }
}

/* ===== 키보드: Enter 제출 ===== */
document.addEventListener('keydown',function(e){
  if(!document.getElementById('quiz').classList.contains('on')) return;
  if(locked) return;
  if(e.key==='Enter'){
    e.preventDefault();
    submitTyping();
  }
});

function next(){
  idx++;
  if(idx>=queue.length){ finish(); }
  else render();
}

function finish(){
  document.getElementById('prog').style.width='100%';
  const total=queue.length;
  const pct=Math.round(score/total*100);
  document.getElementById('rscore').textContent=score;
  document.getElementById('rtotal').textContent=total;
  document.getElementById('rpct').textContent=pct+'%';
  document.getElementById('remoji').textContent = pct===100?'🏆': pct>=80?'🎉': pct>=60?'👍':'💪';

  const review=document.getElementById('review');
  const ok=document.getElementById('rvok');
  const title=document.getElementById('rvtitle');
  review.innerHTML='';
  if(wrongs.length===0){
    title.textContent='오답 확인';
    ok.textContent='';
    review.innerHTML='<div class="allright">완벽해요! 틀린 단어가 없어요 ✨</div>';
  }else{
    title.textContent='오답 확인 ('+wrongs.length+')';
    ok.textContent='맞은 단어 '+score+'개';
    wrongs.forEach(w=>{
      const div=document.createElement('div');
      div.className='ritem';
      div.innerHTML =
        '<div class="q">'+w.def+'</div>'+
        '<div class="ans"><span class="yours">내 답: <s>'+(w.chosen||'(빈칸)')+'</s></span>'+
        '<span class="right">정답: <b class="eng">'+w.en+'</b> <span class="ko">'+w.ko+'</span></span></div>';
      review.appendChild(div);
    });
  }
  show('result');
}

function copyResult(){
  const total=queue.length, pct=Math.round(score/total*100);
  let t='[EngFit 단어 테스트]\nLesson 4 · 영영풀이 (문성중 2학년 한승주)\n\n';
  t+='점수: '+score+'/'+total+' ('+pct+'%)\n';
  t+='날짜: '+new Date().toLocaleDateString('ko-KR')+'\n';
  if(wrongs.length===0){
    t+='\n🏆 모두 정답! 완벽합니다.';
  }else{
    t+='\n■ 틀린 단어 ('+wrongs.length+')\n';
    wrongs.forEach((w,i)=>{ t+=(i+1)+'. '+w.en+' - '+w.ko+'\n'; });
  }
  const done=()=>showToast('복사되었습니다!');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  }else{ fallbackCopy(t,done); }
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta); cb&&cb();
}
let toastT;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1600);
}
function restart(){ show('start'); }
